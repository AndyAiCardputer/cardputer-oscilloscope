[env:m5stack-cardputer-adv-ext]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified@^0.2.10
    m5stack/M5GFX@^0.2.17
